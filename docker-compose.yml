version: '3.8'

# BarakHoo's CRM Client Manager
# Full-stack CRM system with role-based access control and client assignment

services:
  db:
    container_name: barakhoo-crm-db
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crmdb}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm_network

  backend:
    container_name: barakhoo-crm-backend
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-crmdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
    networks:
      - crm_network

  frontend:
    container_name: barakhoo-crm-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/crm/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NGINX_HOST=localhost
    networks:
      crm_network:
      web:
        aliases:
          - crm-frontend

volumes:
  db_data:

# Internal network for db<->backend<->frontend, plus the shared external
# "web" network so the munkys-edge Caddy can reverse-proxy to the frontend
# via the alias "crm-frontend". Only Caddy publishes host ports 80/443.
networks:
  crm_network:
    driver: bridge
  web:
    external: true
