server {
	listen       80;
	server_name  localhost;

	root /usr/share/nginx/html;
	index index.html;

	# Serve static files, fallback to index.html for SPA client-side routing
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Proxy API requests to backend service inside docker-compose network
	location /api/ {
		# Handle CORS preflight locally to avoid forwarding OPTIONS to backend
		if ($request_method = 'OPTIONS') {
			add_header 'Access-Control-Allow-Origin' "$http_origin" always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
			add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept' always;
			add_header 'Access-Control-Allow-Credentials' 'true' always;
			add_header 'Content-Length' 0 always;
			add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
			return 204;
		}

		proxy_pass http://backend:8080;
		proxy_set_header Host $host;
		proxy_set_header Authorization $http_authorization;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
	}

	# Optional: return 404 for resources not found under /static etc.
	location /static/ {
		try_files $uri =404;
	}

	# Reduce logging noise
	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log warn;
}
