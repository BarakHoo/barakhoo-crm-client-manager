## MySQL datasource - edit to match your MySQL server credentials
spring.datasource.url=jdbc:mysql://localhost:3306/crmdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jackson.serialization.write-dates-as-timestamps=false

# H2 console disabled when using MySQL
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=*

# Google OAuth2 Configuration
# To enable Google OAuth: 
# 1. Go to https://console.cloud.google.com/
# 2. Create a project and enable Google+ API
# 3. Create OAuth 2.0 credentials (Web application)
# 4. Set authorized redirect URI: http://localhost:8080/login/oauth2/code/google
# 5. Replace YOUR_CLIENT_ID and YOUR_CLIENT_SECRET below
spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# If you want to use H2 instead, uncomment and adjust the following lines
# spring.datasource.url=jdbc:h2:file:./data/crmdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
