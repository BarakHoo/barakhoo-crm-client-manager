## MySQL datasource - values are supplied via environment variables in deployment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/crmdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jackson.serialization.write-dates-as-timestamps=false

# H2 console disabled when using MySQL
spring.h2.console.enabled=false

# Expose only the health endpoint (avoid leaking env/beans/mappings publicly)
management.endpoints.web.exposure.include=health

# Security-sensitive settings (must be provided via environment in production)
# app.jwt.secret          - required, >= 32 chars
# app.initial.admin.password - required on first boot to create the big_boss user
# app.cors.allowed-origins   - comma-separated list; empty means same-origin only

